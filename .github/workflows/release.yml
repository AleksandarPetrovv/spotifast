name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            package-target: windows-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      # No MilkDrop: it adds a long C++ build for a visualizer this fork skips.
      - run: cargo build --release --no-default-features --target ${{ matrix.target }}

      # The installers must run on a clean Windows machine without a
      # separately installed Visual C++ redistributable.
      - name: Verify standalone Windows runtime
        shell: pwsh
        run: |
          $binary = "target\${{ matrix.target }}\release\spotifast.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Spotifast imports an MSVC runtime:`n$runtime" }

      # Inno Setup ships with the runner image. PowerShell, because bash on
      # Windows rewrites /D... arguments as paths.
      - name: Installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $arch = "${{ matrix.target }}".Split("-")[0]
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DArch=$arch" `
            "/DBinary=$PWD\target\${{ matrix.target }}\release\spotifast.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\spotifast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The Windows Installer package, from the same binary. This release
      # ships it beside the setup program: 0.12.0 updates through the setup
      # program, and its next update moves it to the package.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Windows Installer package
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          gem install native-packages --version 0.9.0 --no-document
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $payload = "dist\msi-input-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $payload | Out-Null
          $files = "target\${{ matrix.target }}\release\spotifast.exe", "README.md", "LICENSE", "packaging\windows\spotifast-installer.txt"
          Copy-Item $files $payload
          $packages = "$env:RUNNER_TEMP\windows-packages"
          native-packages build --version $version --target ${{ matrix.package-target }} --defer-recipes --output $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$packages\packages\${{ matrix.package-target }}\msi\*.msi" dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*-setup.exe
            dist/*.msi
          if-no-files-found: error

  macos:
    name: macos universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release --no-default-features --target aarch64-apple-darwin
          cargo build --release --no-default-features --target x86_64-apple-darwin
      - name: Universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/spotifast \
            target/x86_64-apple-darwin/release/spotifast \
            -output universal/spotifast

      # Ad-hoc signed; Apple Silicon refuses to launch an unsigned app.
      - name: App bundle
        run: |
          mkdir -p dist/macos-input
          bash packaging/macos/bundle.sh universal/spotifast dist/macos-input/Spotifast.app "${GITHUB_REF_NAME#v}"

      # The disk image is what the app's updater installs from.
      - name: Disk image
        run: ruby packaging/macos/dmg.rb dist/macos-input "dist/spotifast-${GITHUB_REF_NAME}-macos-universal.dmg"

      # The installer is for new users: what it installs carries no
      # quarantine flag, so the app opens without the "damaged" warning.
      - name: Installer package
        run: |
          pkgbuild --component dist/macos-input/Spotifast.app --install-location /Applications \
            --identifier rocks.spotifast.Spotifast --version "${GITHUB_REF_NAME#v}" \
            "dist/spotifast-${GITHUB_REF_NAME}-macos-universal.pkg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: |
            dist/*.dmg
            dist/*.pkg
          if-no-files-found: error

  publish:
    name: github release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums for the updater
        run: python3 packaging/release-names.py dist "$GITHUB_REF_NAME"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      # Updaters refuse a release whose checksums.txt lacks a valid signature
      # from the key in assets/update-public-key.hex.
      - name: Sign checksums
        env:
          SPOTIFAST_UPDATE_SIGNING_KEY: ${{ secrets.SPOTIFAST_UPDATE_SIGNING_KEY }}
        run: |
          gem install native-packages --version 0.9.0 --no-document
          native-packages sign-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex \
            --key-env SPOTIFAST_UPDATE_SIGNING_KEY
          native-packages verify-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Spotifast ${{ github.ref_name }}
          body_path: packaging/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          # A tag with a suffix (v1.1.0-beta) is a pre-release: it stays off
          # "latest", so the app's update check never offers it.
          prerelease: ${{ contains(github.ref_name, '-') }}
